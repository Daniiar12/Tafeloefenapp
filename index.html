<!doctype html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tafelapp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid mt-4">
        <div class="row">

            
            <div class="col-4 mb-4">
                <div class="card text-center h-100">
                    <div class="card-header">
                        Tafel van ...
                    </div>
                    <div class="card-body">
                        <label for="inputTafel" class="col-form-label">Welke tafel?</label>
                        <div class="input-group">
                            <input type="number" id="inputTafel" class="form-control" min="1">
                            <button type="button" class="btn btn-success" onclick="showTafel()">GO!</button>
                        </div>
                        <p class="card-text mt-3" id="outputTafel"></p>
                    </div>
                    <div class="card-footer text-body-secondary">
                        Made by Daniiar
                    </div>
                </div>
            </div>

            
            <div class="col-4 mb-4">
                <div class="card text-center h-100">
                    <div class="card-header">
                        Tafel oefenen
                    </div>
                    <div class="card-body">
                        <label for="oefenTafelInput" class="col-form-label">Welke tafel?</label>
                        <div class="input-group">
                            <input type="number" id="oefenTafelInput" class="form-control" min="1">
                            <button type="button" class="btn btn-success" onclick="startOefenen()">Start</button>
                        </div>
                        <div id="oefenSectie" class="mt-4 d-none">
                            <h2 id="oefenVraag"></h2>
                            <div class="input-group">
                                <input type="number" id="oefenAntwoord" class="form-control" placeholder="Antwoord">
                                <button type="button" class="btn btn-primary"
                                    onclick="controleerOefenen()">Controleer</button>
                            </div>
                        </div>
                        <p class="mt-3 fw-bold" id="oefenFeedback"></p>
                    </div>
                    <div class="card-footer text-body-secondary">
                        Made by Daniiar
                    </div>
                </div>
            </div>

            
            <div class="col-4 mb-4">
                <div class="card text-center h-100">
                    <div class="card-header">
                        Tafels oefenen
                    </div>
                    <div class="card-body">
                        <div class="row g-2 align-items-end">
                            <div class="col">
                                <label for="rangeVan" class="col-form-label">Van</label>
                                <input type="number" id="rangeVan" class="form-control" min="1">
                            </div>
                            <div class="col">
                                <label for="rangeTot" class="col-form-label">t/m</label>
                                <input type="number" id="rangeTot" class="form-control" min="1">
                            </div>
                            <div class="col-auto">
                                <button type="button" class="btn btn-success" onclick="startRange()">Start</button>
                            </div>
                        </div>
                        <div id="rangeSectie" class="mt-4 d-none">
                            <h2 id="rangeVraag"></h2>
                            <div class="input-group">
                                <input type="number" id="rangeAntwoord" class="form-control" placeholder="Antwoord">
                                <button type="button" class="btn btn-primary"
                                    onclick="controleerRange()">Controleer</button>
                            </div>
                        </div>
                        <p class="mt-3 fw-bold" id="rangeFeedback"></p>
                    </div>
                    <div class="card-footer text-body-secondary">
                        Made by Daniiar
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="tafelapp.js"></script>
</body>

</html>
